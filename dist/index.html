<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Esencial FC" />
    <meta name="application-name" content="Esencial FC" />
    <meta name="description" content="Sistema de pedidos Esencial FC" />

    <!-- Favicons e Íconos actualizados para el nuevo logo -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    
    <!-- Manifiesto de la PWA corregido -->
    <link rel="manifest" href="/site.webmanifest?v=4" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Esencial FC</title>
    <script>
      // Capturar evento de instalacion PWA
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault()
        window.__pwaInstallPrompt = e
        window.dispatchEvent(new Event('pwaInstallReady'))
      })
      // Registrar Service Worker y actualizar la app sola cuando hay version nueva
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('SW OK')
              // Revisar si hay una version nueva cada vez que la app vuelve a primer plano
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') reg.update().catch(() => {})
              })
              // Revisar tambien cada 5 minutos mientras la app este abierta
              setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000)
            })
            .catch(e => console.warn('SW:', e))
        })
        // Cuando el Service Worker nuevo toma control, recargar UNA vez para
        // que la pestaña abierta pase a correr el codigo mas reciente sola,
        // sin que nadie tenga que recargar la pagina a mano.
        let recargando = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (recargando) return
          recargando = true
          window.location.reload()
        })
      }
    </script>
    <script type="module" crossorigin src="/assets/index-DRVKdweM.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
